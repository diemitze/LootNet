<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LootNet - Cinema Summary + Closing Lines</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0b0d; color:#ccc; min-height:100vh; padding:24px 0 60px;
         font-family:'Segoe UI',Arial,sans-serif; display:flex; flex-direction:column; align-items:center; }
  .chrome { display:flex; gap:7px; margin-bottom:8px; flex-wrap:wrap; justify-content:center; max-width:1160px; }
  .chrome button { background:#1a1a1e; border:1px solid #333; color:#bbb; padding:8px 14px;
                   font:600 11px/1 'Segoe UI'; letter-spacing:1.5px; cursor:pointer; }
  .chrome button:hover { border-color:#666; color:#fff; }
  .chrome button.active { background:#ffd700; color:#111; border-color:#ffd700; }
  .hint { font-size:12px; color:#666; margin:12px 0 16px; letter-spacing:.5px; }
  .hint b { color:#ffd700; font-weight:600; }

  .stage { width:1160px; height:653px; position:relative; overflow:hidden;
           background:radial-gradient(circle at 30% 25%, #23303a 0%, #12161b 55%, #08090b 100%);
           box-shadow:0 24px 60px rgba(0,0,0,.7); }
  .stage::before { content:''; position:absolute; inset:0; opacity:.4;
    background:linear-gradient(115deg, transparent 40%, rgba(120,140,110,.25) 41%, transparent 43%),
               linear-gradient(200deg, rgba(80,90,70,.4), transparent 60%),
               repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 40px); }
  .v { position:absolute; inset:0; }
  .d-tint { position:absolute; inset:0; background:rgba(4,6,10,.55); opacity:0; transition:.9s; }
  .play .d-tint { opacity:1; }
  .d-bar { position:absolute; left:0; right:0; height:0; background:#000; transition:height .65s cubic-bezier(.3,.9,.2,1); }
  .d-bar.t { top:0 } .d-bar.b { bottom:0 }
  .play .d-bar { height:91px; }
  .d-line { position:absolute; left:91px; bottom:193px; width:2px; height:0; background:#ffd700; transition:height .5s ease-out .35s; }
  .play .d-line { height:127px; }
  .d-body { position:absolute; left:115px; bottom:193px; }
  .d-kick { font:400 10px/1 'Segoe UI'; letter-spacing:8px; color:#8a8a8a; margin-bottom:14px; opacity:0; transition:.6s .55s; }
  .play .d-kick { opacity:1; }
  .d-title { font:300 30px/1 'Segoe UI'; letter-spacing:1px; color:#fff; margin-bottom:18px;
             opacity:0; transform:translateY(8px); transition:.7s .75s; }
  .play .d-title { opacity:1; transform:none; }
  .died .d-title { color:#ff8a8a; }
  .d-total { font:300 46px/1 'Segoe UI'; color:#ffd700; letter-spacing:1px; opacity:0; transition:.5s 1.05s; }
  .play .d-total { opacity:1; }
  .d-quip { position:absolute; left:115px; bottom:150px; font:italic 300 15px/1.4 'Segoe UI'; color:#a8a8a8;
            opacity:0; transition:.9s; }
  .d-quip.on { opacity:1; }
  .d-side { position:absolute; right:115px; bottom:193px; width:390px; }
  .d-srow { display:flex; justify-content:space-between; align-items:center; padding:4px 0; height:22px;
            opacity:0; transform:translateX(12px); transition:.4s; }
  .d-srow.on { opacity:1; transform:none; }
  .d-srow em { font:400 13px/1 'Segoe UI'; font-style:normal; color:#d2d2d2; }
  .d-srow b   { font:400 13px/1 'Segoe UI'; font-weight:400; }
  .d-rule { height:1px; background:rgba(255,255,255,.09); margin:9px 0; }
  .d-sum { display:flex; justify-content:space-between; opacity:0; transition:.5s; }
  .d-sum.on { opacity:1; }
  .d-sum em { font:400 11px/1 'Segoe UI'; font-style:normal; color:#999; }
  .d-sum b  { font:400 12px/1 'Segoe UI'; color:#d9b840; }
  .d-bonus { text-align:left; font:400 9.5px/1 'Segoe UI'; color:#7a8f7a; margin-top:7px; opacity:0; transition:.6s; }
  .d-bonus.on { opacity:1; }
  .d-meta { position:absolute; left:115px; bottom:40px; font:400 9px/1 'Segoe UI'; letter-spacing:5px; color:#4a4a4a;
            opacity:0; transition:.6s; }
  .d-meta.on { opacity:1; }
  .d-prog { position:absolute; left:0; bottom:0; height:2px; background:rgba(255,215,0,.45); width:100%; }

  .pool { width:1160px; margin-top:22px; border-left:3px solid #333; padding-left:16px; font-size:12.5px; line-height:1.9; color:#8a8a8a; }
  .pool h3 { color:#e8e8e8; font-size:13px; letter-spacing:2px; margin-bottom:8px; }
  .pool li { list-style:none; }
  .pool li.cur { color:#ffd700; }
</style>
</head>
<body>

<div class="chrome" id="chrome"></div>
<div class="hint">Design D as shipped. Scenario buttons pick the closing-line bucket - <b>NEXT LINE</b> cycles the pool for that bucket.</div>
<div class="stage" id="stage"></div>
<div class="pool" id="pool"></div>

<script>
const POOLS = {
diedRich:["That is a very expensive corpse.","Somewhere, a Scav just retired.","You were the loot piñata today.","Insurance does not cover emotional damage.","Whoever killed you is now the best equipped bot on the map.","All of that, delivered straight into someone else's pockets.","Every last item, gifted to whoever found you.","You held it for almost the whole raid.","That backpack had a great, short life.","It was all yours right up until it was not.","Peak looting. Zero extraction.","You were carrying a fortune and a target."],
diedFighter:["You took people with you. That counts for something.","Went down swinging, at least.","Not a quiet death, then.","You made it expensive for them.","Lost the raid, won the fight. Mostly.","Bodies everywhere and still no extract.","Aggression is a strategy. Just not a good one.","You were the problem right up until you were not.","Statistically you won. Practically you died."],
diedEmpty:["Not a single item. Impressive, in a way.","You came, you saw, you died.","Nothing gained, everything lost.","A round trip with no cargo.","Straight there, straight down.","Not even a bolt to show for it.","Speedrun complete.","That was a very short story.","You skipped the looting part entirely."],
diedBroke:["At least it was a cheap lesson.","You died as you lived: broke.","Barely worth the bullet.","Nothing ventured, nothing lost.","Cheapest raid you have lost all week.","The kit cost more than the loot.","Whoever looted you was disappointed.","Small stakes, small tragedy.","You lost almost nothing. Almost."],
diedDefault:["Tarkov giveth, Tarkov taketh away.","Better luck next raid.","Rest in pieces.","The map remains undefeated.","That one is going to sting for a bit.","Caught somewhere between greed and the extract.","It happens. Repeatedly.","The next raid is already loading.","You will be back in there in two minutes anyway.","Write it off as reconnaissance.","The insurance man will call. Eventually."],
survHuge:["Retire? In this economy? Yes.","The flea market is not ready for you.","That is rent for the month.","Absolute banger of a raid.","Try not to lose it all next raid.","Do not spend it all on ammo.","A whole hideout upgrade in one bag.","An unreasonable amount of loot for one man.","Genuinely a problem for the local economy.","You can afford to be reckless now. Do not be.","Somewhere a Scav is crying about this."],
survGood:["Solid haul. Nothing to be ashamed of.","Therapist will see you now.","An honest day's looting.","Out clean and heavier than you went in.","Nothing dramatic. Just profit.","Professional work.","In, took things, left. Correct.","That will keep you kitted for a while.","Quietly excellent."],
survEmpty:["You extracted with your dignity and nothing else.","A tactical stroll, then.","Zero loot. Zero risk taken.","You went for a walk and came home.","Sightseeing, then.","You visited. That was nice.","Nothing on you, nothing lost. Balanced.","The bravest option: touch nothing.","A raid so clean it left no evidence."],
survBroke:["You risked your life for pocket change.","Barely worth the extraction.","It is the exercise that counts.","The bolts will be worth something one day.","A rouble is a rouble.","That will almost cover the ammo.","Every empire starts somewhere. Probably not here.","You made it out with vibes.","Technically profitable. Technically."],
survFighter:["Extracted covered in other people's problems.","You did not come here to loot, clearly.","Someone had to thin the population.","Loot was clearly optional today.","Out with mostly other people's kit.","Kill count up, backpack empty. Priorities.","The map is quieter now.","You went hunting and forgot the shopping list."],
survDefault:["Out clean. That is a win.","Another one for the books.","No notes. Just leave.","Boring is underrated.","No drama. Take the win.","Uneventful. The best kind.","In, out, no complaints.","A raid happened. You survived it.","Textbook. Boring. Perfect."]
};

const BIG=[["LEDX Skin Transilluminator",780000],["Graphics card",520000],["Ophthalmoscope",310000],["Intelligence folder",240000],["Tetriz portable game",150000]];
const MID=[["Bolt",12000],["Screw nut",9800],["Duct tape",8400],["Wires",6200],["Toothpaste",3100]];

const SCEN = {
  survHuge:   {died:false, label:"SURVIVED · RICH",   items:BIG, total:2104000, n:47, pmc:3, scav:6, xp:12480, bonus:2500},
  survGood:   {died:false, label:"SURVIVED · DECENT", items:BIG.slice(2), total:410000, n:22, pmc:1, scav:2, xp:6200, bonus:2500},
  survFighter:{died:false, label:"SURVIVED · KILLER", items:BIG.slice(3), total:190000, n:9, pmc:4, scav:5, xp:9100, bonus:2500},
  survBroke:  {died:false, label:"SURVIVED · BROKE",  items:MID, total:39500, n:14, pmc:0, scav:1, xp:1800, bonus:2500},
  survEmpty:  {died:false, label:"SURVIVED · EMPTY",  items:[], total:0, n:0, pmc:0, scav:0, xp:900, bonus:2500},
  diedRich:   {died:true,  label:"DIED · RICH",       items:BIG, total:1520000, n:31, pmc:1, scav:4, xp:8300, bonus:0},
  diedFighter:{died:true,  label:"DIED · FIGHTING",   items:BIG.slice(2), total:260000, n:11, pmc:3, scav:2, xp:7400, bonus:0},
  diedBroke:  {died:true,  label:"DIED · BROKE",      items:MID, total:31000, n:8, pmc:0, scav:0, xp:1200, bonus:0},
  diedEmpty:  {died:true,  label:"DIED · EMPTY",      items:[], total:0, n:0, pmc:0, scav:1, xp:600, bonus:0},
  diedDefault:{died:true,  label:"DIED · AVERAGE",    items:BIG.slice(3), total:140000, n:17, pmc:0, scav:2, xp:4100, bonus:0},
};

const tint = v => v>=500000?'#ff73d9':v>=300000?'#c78cff':v>=150000?'#73bfff':v>=50000?'#e6c74d':'#b8b8b8';
const fmt = n => "₽ " + n.toLocaleString('en-US');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

let cur='survHuge', qi=0, token=0;

function markup(s, quip){
  return `<div class="v ${s.died?'died':''}">
    <div class="d-tint"></div><div class="d-bar t"></div><div class="d-bar b"></div>
    <div class="d-line"></div>
    <div class="d-body">
      <div class="d-kick">${s.died?'EXTRACTION FAILED!':'EXTRACTION COMPLETE'}</div>
      <div class="d-title">${s.died?'You did not make it out.':'You made it out.'}</div>
      <div class="d-total" id="num">₽ 0</div>
    </div>
    <div class="d-quip">${quip}</div>
    <div class="d-side">
      ${s.items.map(([n,v])=>`<div class="d-srow"><em>${n}</em><b style="color:${tint(v)}">₽${v.toLocaleString('en-US')}</b></div>`).join('')}
      <div class="d-rule"></div>
      <div class="d-sum"><em>${s.n} items · ${s.pmc} PMC · ${s.scav} Scav</em><b id="xp">+${s.xp.toLocaleString('en-US')} XP</b></div>
      <div class="d-bonus" id="bonus"></div>
    </div>
    <div class="d-meta">CUSTOMS · 14:22 · CLICK ANYWHERE TO CLOSE</div>
    <div class="d-prog"></div>
  </div>`;
}

async function play(){
  const my=++token, s=SCEN[cur];
  const quip=POOLS[cur][qi % POOLS[cur].length];
  const stage=document.getElementById('stage');
  stage.innerHTML=markup(s,quip);
  const root=stage.firstElementChild, alive=()=>my===token;
  await sleep(30); root.classList.add('play');

  // total counts up
  await sleep(1150); if(!alive())return;
  const num=root.querySelector('#num'), t0=performance.now();
  (function step(now){ if(!alive())return; const p=Math.min(1,(now-t0)/1400);
    num.textContent=fmt(Math.round(s.total*(1-Math.pow(1-p,3)))); if(p<1)requestAnimationFrame(step); })(performance.now());
  await sleep(1400);

  for(const r of root.querySelectorAll('.d-srow')){ if(!alive())return; r.classList.add('on'); await sleep(200); }
  if(!alive())return; root.querySelector('.d-sum').classList.add('on');

  if(s.bonus>0){
    await sleep(900); if(!alive())return;
    const xp=root.querySelector('#xp'), b=root.querySelector('#bonus');
    b.textContent=`incl. +${s.bonus.toLocaleString('en-US')} ${s.died?'extract':'survived'} bonus`; b.classList.add('on');
    xp.textContent=`+${(s.xp+s.bonus).toLocaleString('en-US')} XP`;
  }

  await sleep(500); if(!alive())return;
  root.querySelector('.d-quip').classList.add('on');
  await sleep(400); if(!alive())return;
  root.querySelector('.d-meta').classList.add('on');
}

function renderPool(){
  const p=POOLS[cur];
  document.getElementById('pool').innerHTML =
    `<h3>CLOSING LINES · ${SCEN[cur].label}</h3>` +
    p.map((l,i)=>`<li class="${i===qi%p.length?'cur':''}">${l}</li>`).join('');
}
function renderChrome(){
  const c=document.getElementById('chrome');
  c.innerHTML = Object.keys(SCEN).map(k=>`<button data-k="${k}" class="${k===cur?'active':''}">${SCEN[k].label}</button>`).join('')
              + `<button id="next">NEXT LINE ▸</button>`;
  c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cur=b.dataset.k; qi=0; renderChrome(); renderPool(); play();});
  document.getElementById('next').onclick=()=>{qi++; renderPool(); play();};
}
renderChrome(); renderPool(); play();
</script>
</body>
</html>
