<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LootNet - Raid Summary Redesigns</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0b0b0d; color:#ccc; min-height:100vh; padding:26px 0 60px;
    font-family:'Segoe UI',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  .chrome { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; justify-content:center; }
  .chrome button {
    background:#1a1a1e; border:1px solid #333; color:#bbb; padding:9px 16px;
    font:600 12px/1 'Segoe UI',sans-serif; letter-spacing:2px; cursor:pointer;
  }
  .chrome button:hover { border-color:#666; color:#fff; }
  .chrome button.active { background:#ffd700; color:#111; border-color:#ffd700; }
  .chrome button.died.active { background:#f22e2e; color:#fff; border-color:#f22e2e; }
  .chrome .sep { width:1px; background:#333; margin:0 6px; }
  .caption { font-size:12px; color:#666; letter-spacing:1px; margin:14px 0 18px; text-align:center; max-width:1160px; }
  .caption b { color:#ffd700; font-weight:600; }

  .stage {
    width:1160px; height:700px; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 30% 25%, #23303a 0%, #12161b 55%, #08090b 100%);
    box-shadow:0 24px 60px rgba(0,0,0,.7);
  }
  /* fake gameplay screenshot behind everything */
  .stage::before {
    content:''; position:absolute; inset:0; opacity:.35;
    background:
      linear-gradient(115deg, transparent 40%, rgba(120,140,110,.25) 41%, transparent 43%),
      linear-gradient(200deg, rgba(80,90,70,.4), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 40px);
  }
  .v { position:absolute; inset:0; }
  .mono { font-family:'Consolas','Courier New',monospace; }
  .notes {
    width:1160px; margin-top:20px; font-size:12.5px; line-height:1.7; color:#8a8a8a;
    border-left:3px solid #333; padding-left:16px;
  }
  .notes h3 { color:#e8e8e8; font-size:14px; letter-spacing:2px; margin-bottom:8px; }
  .notes span { color:#ffd700; }

/* ══════════════ A · DOSSIER ══════════════ */
  .v-a { background:rgba(6,6,8,.90); }
  .a-rail { position:absolute; left:0; top:0; bottom:0; width:56px; background:#0e0e12; border-right:1px solid #262626; }
  .a-rail i {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-90deg);
    white-space:nowrap; font:600 11px/1 'Segoe UI'; letter-spacing:7px; color:#4a4a4a; font-style:normal;
  }
  .a-rail::before { content:''; position:absolute; left:0; top:0; width:3px; height:0; background:#ffd700; transition:height .5s ease-out; }
  .play .a-rail::before { height:100%; }
  .a-head { position:absolute; left:104px; top:52px; }
  .a-kicker { font:600 10px/1 'Segoe UI'; letter-spacing:6px; color:#4d4d4d; margin-bottom:14px;
              opacity:0; transform:translateY(8px); transition:.4s; }
  .play .a-kicker { opacity:1; transform:none; transition-delay:.25s; }
  .a-title { font:800 62px/.9 'Segoe UI'; letter-spacing:4px; color:#f0f0f0;
             clip-path:inset(0 100% 0 0); transition:clip-path .55s cubic-bezier(.2,.8,.2,1); }
  .play .a-title { clip-path:inset(0 0 0 0); transition-delay:.35s; }
  .died .a-title { color:#f24b4b; }

  .a-stamp {
    position:absolute; right:78px; top:46px; padding:10px 26px;
    border:3px solid #5fbf5f; color:#5fbf5f; font:800 26px/1 'Segoe UI'; letter-spacing:5px;
    transform:rotate(-11deg) scale(2.6); opacity:0; transition:.28s cubic-bezier(.2,1.4,.4,1);
  }
  .died .a-stamp { border-color:#f24b4b; color:#f24b4b; }
  .play .a-stamp { transform:rotate(-11deg) scale(1); opacity:.92; transition-delay:1.05s; }

  .a-total { position:absolute; left:104px; top:196px; }
  .a-total .lbl { font:600 10px/1 'Segoe UI'; letter-spacing:5px; color:#4d4d4d; margin-bottom:10px; }
  .a-total .num { font:700 76px/1 'Consolas',monospace; color:#ffd700; letter-spacing:-1px; }
  .a-total .num.big { text-shadow:0 0 26px rgba(255,215,0,.45); }

  .a-stats { position:absolute; left:104px; top:330px; width:400px; }
  .a-stat { display:flex; align-items:baseline; gap:14px; padding:9px 0; border-bottom:1px solid #1c1c20;
            opacity:0; transform:translateX(-14px); transition:.35s; }
  .play .a-stat.on { opacity:1; transform:none; }
  .a-stat b { font:700 26px/1 'Consolas',monospace; min-width:58px; }
  .a-stat span { font:400 12px/1 'Segoe UI'; letter-spacing:3px; color:#6a6a6a; text-transform:uppercase; }

  .a-ledger { position:absolute; right:64px; top:190px; width:470px; }
  .a-ledger .lbl { font:600 10px/1 'Segoe UI'; letter-spacing:5px; color:#4d4d4d; margin-bottom:16px;
                   border-bottom:1px solid #262626; padding-bottom:10px; }
  .a-row { display:flex; align-items:baseline; gap:8px; padding:8px 0; font:400 14px/1 'Segoe UI';
           opacity:0; transform:translateY(6px); transition:.22s; }
  .play .a-row.on { opacity:1; transform:none; }
  .a-row .n { color:#d8d8d8; white-space:nowrap; }
  .a-row .fill { flex:1; border-bottom:1px dotted #333; transform:translateY(-4px); }
  .a-row .p { font-family:'Consolas',monospace; font-size:13px; }
  .a-foot { position:absolute; left:0; right:0; bottom:22px; text-align:center;
            font:400 11px/1 'Segoe UI'; letter-spacing:4px; color:#3e3e3e; opacity:0; transition:.5s; }
  .play .a-foot { opacity:1; transition-delay:2.6s; }

/* ══════════════ B · TERMINAL ══════════════ */
  .v-b { background:rgba(2,6,4,.94); display:flex; align-items:center; justify-content:center; }
  .b-crt { width:820px; color:#7dffa8; font-family:'Consolas','Courier New',monospace; font-size:16px; line-height:1.95;
           text-shadow:0 0 8px rgba(80,255,150,.35); }
  .died .b-crt { color:#ffb3a0; text-shadow:0 0 8px rgba(255,90,60,.35); }
  .b-crt .dim { color:#3f7a58; }
  .died .b-crt .dim { color:#8a5045; }
  .b-line { display:flex; white-space:pre; opacity:0; }
  .b-line.on { opacity:1; }
  .b-line .fill { flex:1; overflow:hidden; }
  .b-line .fill::after { content:'..........................................................................'; color:#2e5d42; }
  .died .b-line .fill::after { color:#6b3f38; }
  .b-total { display:flex; white-space:pre; margin-top:10px; padding-top:12px; border-top:2px solid currentColor;
             font-size:30px; font-weight:700; opacity:0; transform:scale(.96); transition:.2s; }
  .b-total.on { opacity:1; transform:none; }
  .b-cursor { display:inline-block; width:10px; height:17px; background:currentColor; vertical-align:-2px;
              animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0 } }
  .v-b::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
    animation:flick 4s infinite;
  }
  @keyframes flick { 0%,97%,100% { opacity:.9 } 98% { opacity:.55 } }
  .b-glow { position:absolute; inset:0; pointer-events:none;
            background:radial-gradient(ellipse at 50% 50%, rgba(60,255,140,.07), transparent 65%); }
  .died .b-glow { background:radial-gradient(ellipse at 50% 50%, rgba(255,70,40,.07), transparent 65%); }

/* ══════════════ C · ARCADE TALLY ══════════════ */
  .v-c { background:rgba(8,4,10,.93); overflow:hidden; }
  .c-burst { position:absolute; inset:0; background:radial-gradient(circle at 50% 42%, rgba(255,215,0,.22), transparent 55%);
             opacity:0; transition:opacity .12s; }
  .c-burst.on { opacity:1; }
  .c-head { position:absolute; top:54px; left:0; right:0; text-align:center;
            font:800 30px/1 'Segoe UI'; letter-spacing:10px; color:#fff;
            opacity:0; transform:scale(1.6); transition:.35s cubic-bezier(.2,1.3,.4,1); }
  .play .c-head { opacity:1; transform:none; }
  .died .c-head { color:#ff4b4b; }
  .c-total { position:absolute; top:150px; left:0; right:0; text-align:center;
             font:800 108px/1 'Consolas',monospace; color:#ffd700; letter-spacing:-2px;
             text-shadow:0 0 40px rgba(255,215,0,.35); }
  .c-total.kick { animation:kick .18s ease-out; }
  @keyframes kick { 50% { transform:scale(1.07) } }
  .c-sub { position:absolute; top:272px; left:0; right:0; text-align:center;
           font:600 11px/1 'Segoe UI'; letter-spacing:6px; color:#5a5a5a; }
  .c-combo { position:absolute; top:170px; right:130px; font:800 46px/1 'Segoe UI'; color:#ff7b2f;
             opacity:0; transform:rotate(-8deg) scale(.6); transition:.2s cubic-bezier(.2,1.5,.4,1); }
  .c-combo.on { opacity:1; transform:rotate(-8deg) scale(1); }
  .c-chips { position:absolute; top:322px; left:80px; right:80px; height:180px;
             display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start; justify-content:center; }
  .c-chip { padding:11px 18px; background:#15151c; border-left:4px solid #444;
            font:600 14px/1 'Segoe UI'; color:#e0e0e0; display:flex; gap:14px; align-items:center;
            opacity:0; transform:translateX(90px) scale(1.25); transition:.26s cubic-bezier(.15,.9,.3,1); }
  .c-chip.on { opacity:1; transform:none; }
  .c-chip small { font-family:'Consolas',monospace; font-size:13px; font-weight:400; }
  .c-stats { position:absolute; bottom:52px; left:0; right:0; display:flex; justify-content:center; gap:64px; }
  .c-stat { text-align:center; opacity:0; transform:translateY(10px); transition:.3s; }
  .play .c-stat.on { opacity:1; transform:none; }
  .c-stat b { display:block; font:700 34px/1 'Consolas',monospace; }
  .c-stat span { font:400 10px/1 'Segoe UI'; letter-spacing:4px; color:#5a5a5a; }

/* ══════════════ D · CINEMA ══════════════ */
  .v-d { background:transparent; }
  .d-bar { position:absolute; left:0; right:0; height:0; background:#000; transition:height .6s cubic-bezier(.3,.9,.2,1); }
  .d-bar.t { top:0 } .d-bar.b { bottom:0 }
  .play .d-bar { height:118px; }
  .d-tint { position:absolute; inset:0; background:rgba(4,6,10,.55); opacity:0; transition:.9s; }
  .play .d-tint { opacity:1; }
  .d-line { position:absolute; left:96px; bottom:190px; width:2px; height:0; background:#ffd700; transition:height .5s ease-out .5s; }
  .play .d-line { height:132px; }
  .d-body { position:absolute; left:124px; bottom:190px; }
  .d-kick { font:400 11px/1 'Segoe UI'; letter-spacing:8px; color:#8a8a8a; margin-bottom:12px;
            opacity:0; transition:.7s .7s; }
  .play .d-kick { opacity:1; }
  .d-title { font:300 44px/1 'Segoe UI'; letter-spacing:2px; color:#fff; margin-bottom:20px;
             opacity:0; transform:translateY(12px); transition:.8s .85s; }
  .play .d-title { opacity:1; transform:none; }
  .died .d-title { color:#ff8a8a; }
  .d-total { font:300 60px/1 'Segoe UI'; color:#ffd700; letter-spacing:1px;
             opacity:0; transition:.8s 1.1s; }
  .play .d-total { opacity:1; }
  .d-side { position:absolute; right:110px; bottom:192px; width:330px; text-align:right; }
  .d-srow { font:400 13px/1 'Segoe UI'; color:#9a9a9a; padding:7px 0; display:flex; justify-content:space-between;
            opacity:0; transform:translateX(14px); transition:.5s; }
  .play .d-srow.on { opacity:1; transform:none; }
  .d-srow em { font-style:normal; color:#dcdcdc; }
  .d-srow b { font:400 13px/1 'Consolas',monospace; color:#c9a227; }
  .d-meta { position:absolute; left:124px; bottom:60px; font:400 10px/1 'Segoe UI'; letter-spacing:5px; color:#4a4a4a;
            opacity:0; transition:.6s 1.9s; }
  .play .d-meta { opacity:1; }
</style>
</head>
<body>

<div class="chrome">
  <button data-v="a" class="active">A · DOSSIER</button>
  <button data-v="b">B · TERMINAL</button>
  <button data-v="c">C · ARCADE TALLY</button>
  <button data-v="d">D · CINEMA</button>
  <div class="sep"></div>
  <button id="outcome">SURVIVED</button>
  <button id="replay">▶ REPLAY</button>
  <button id="mute">🔊 SOUND ON</button>
</div>
<div class="caption" id="caption"></div>

<div class="stage" id="stage"></div>
<div class="notes" id="notes"></div>

<script>
const ITEMS = [
  ["LEDX Skin Transilluminator", 780000],
  ["Graphics card",              520000],
  ["Ophthalmoscope",             310000],
  ["Intelligence folder",        240000],
  ["Tetriz portable game",       150000],
  ["Gas analyzer",                92000],
  ["Bolt",                        12000],
];
const TOTAL = ITEMS.reduce((s,i)=>s+i[1],0);
const STATS = { items:47, pmc:3, scav:6, xp:12480, bonus:2500 };

const fmt = n => "₽ " + n.toLocaleString('en-US');
const rare = v => v>=500000?'#ff2fcc':v>=300000?'#bf4dff':v>=150000?'#33b3ff':v>=50000?'#ffd91a':'#6a6a6a';

/* ── synthesized sound schemes (stand-ins for the EFT UI sounds) ── */
let AC=null, muted=false;
const ac = () => AC || (AC = new (window.AudioContext||window.webkitAudioContext)());
function tone(f, dur, type='sine', gain=.14, slideTo=null){
  if(muted) return; const c=ac(); const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,c.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
  g.gain.setValueAtTime(gain,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}
function noise(dur=.04, gain=.2, hp=1200){
  if(muted) return; const c=ac(); const n=c.sampleRate*dur;
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=c.createGain(); g.gain.value=gain;
  s.connect(f).connect(g).connect(c.destination); s.start();
}
const SND = {
  a: { // paper / typewriter / rubber stamp
    enter:()=>{ noise(.35,.12,300); tone(90,.5,'sine',.10); },
    tick:i=>{ noise(.03,.22,2200); tone(1400+i*40,.03,'square',.03); },
    stat:()=>{ noise(.05,.16,900); },
    accent:()=>{ noise(.09,.30,180); tone(70,.22,'sine',.22); },  // stamp thud
    finale:()=>{ tone(160,.5,'triangle',.16,320); noise(.12,.15,400); }
  },
  b: { // CRT terminal / modem / relay
    enter:()=>{ tone(1800,.06,'square',.05); tone(420,.5,'sawtooth',.05,140); },
    tick:i=>{ tone(880+((i*7)%5)*90,.035,'square',.045); },
    stat:()=>{ tone(1320,.04,'square',.04); },
    accent:()=>{ tone(220,.14,'square',.09); },
    finale:()=>{ tone(110,.7,'sawtooth',.14); setTimeout(()=>tone(220,.5,'square',.09),70); }
  },
  c: { // arcade tally, rising pitch
    enter:()=>{ tone(300,.28,'square',.12,900); },
    tick:i=>{ tone(500+i*130,.09,'square',.10, 700+i*150); },
    stat:()=>{ tone(1200,.06,'triangle',.10); },
    accent:()=>{ tone(1600,.10,'square',.10,2400); },
    finale:()=>{ [0,90,180,300].forEach((d,k)=>setTimeout(()=>tone([523,659,784,1046][k],.35,'square',.13),d)); }
  },
  d: { // cinematic, sparse and low
    enter:()=>{ tone(55,1.6,'sine',.22); tone(82.5,1.6,'sine',.10); },
    tick:()=>{ noise(.02,.05,4000); },
    stat:()=>{},
    accent:()=>{ tone(196,.9,'sine',.10); },
    finale:()=>{ tone(130.8,1.8,'sine',.16); setTimeout(()=>tone(196,1.6,'sine',.10),120); }
  }
};

const NOTES = {
a:`<h3>A · DOSSIER / FIELD REPORT</h3>
Edge-to-edge, no floating box. A vertical gold rail wipes down the left, the title <b>types out</b> behind a clip mask,
and the outcome lands as an oversized rotated <span>rubber stamp</span>. Loot reads as a paper manifest with dotted
leader lines, right column; totals and stats hold the left column.<br>
<span>Sound:</span> paper rustle on entry, dry typewriter clicks per manifest line, a heavy <b>thud</b> for the stamp,
low mechanical resolve on the total. EFT events: <b>MenuOpenContainer</b> → <b>ButtonClick</b> ×N → <b>InsuranceItemOnInsure</b> → <b>QuestCompleted</b>.`,
b:`<h3>B · TERMINAL / TRANSACTION LOG</h3>
Everything is one monospace printout on a phosphor CRT, centered. Lines print sequentially with a live caret,
values right-aligned, dotted fill between. The total slams under a double rule. Scanlines + occasional flicker;
death recolours the whole tube to amber-red.<br>
<span>Sound:</span> boot beep and modem sweep, one square-wave keyclick per printed line, relay clunk on section breaks,
low sawtooth drop on <b>TOTAL</b>. EFT events: <b>MenuCheckBox</b> ×N → <b>MenuEscape</b> → <b>QuestStarted</b>.`,
c:`<h3>C · ARCADE TALLY</h3>
Loudest option. Big centered counter, items <b>fly in from the right</b> as chips and slam into a pile, each one
kicking the counter and flashing the screen. A <span>combo multiplier</span> ramps in the corner as high-value items land.
Stats punch up along the bottom at the end.<br>
<span>Sound:</span> pitch <b>rises with every item</b> (classic tally), coin ping on rare finds, screen-flash whoosh,
four-note fanfare on the final total. EFT events: <b>MenuCheckBox</b> (escalating) → <b>RepairComplete</b> → <b>QuestCompleted</b>.`,
d:`<h3>D · CINEMA / LETTERBOX</h3>
Quietest option, keeps your death screen visible. Black bars slide in, a thin gold rule draws down the left,
and light typography fades in over the bottom third. Loot is a restrained right-aligned list, no panels or badges.
Slow, no counting-up frenzy.<br>
<span>Sound:</span> a single low drone on entry, near-silent ticks as lines appear, one warm resolve chord at the end.
EFT events: <b>PlayerIsDead</b>/<b>BackpackOpen</b> → (silence) → <b>AchievementCompleted</b>.`
};

/* ── markup builders ── */
function tplA(died){
  return `<div class="v v-a">
    <div class="a-rail"><i>LOOTNET // RAID REPORT // CUSTOMS 14:22</i></div>
    <div class="a-head">
      <div class="a-kicker">OPERATION DEBRIEF</div>
      <div class="a-title">${died?'K.I.A.':'EXTRACTED'}</div>
    </div>
    <div class="a-stamp">${died?'FAILED':'SURVIVED'}</div>
    <div class="a-total">
      <div class="lbl">TOTAL VALUE RECOVERED</div>
      <div class="num" id="num">₽ 0</div>
    </div>
    <div class="a-stats">
      <div class="a-stat"><b style="color:#ffd700">0</b><span>items looted</span></div>
      <div class="a-stat"><b style="color:#ff4b4b">0</b><span>pmc kills</span></div>
      <div class="a-stat"><b style="color:#8a8a8a">0</b><span>scav kills</span></div>
      <div class="a-stat"><b style="color:#66d9ff">0</b><span>xp earned</span></div>
    </div>
    <div class="a-ledger">
      <div class="lbl">RECOVERED MANIFEST</div>
      ${ITEMS.map(([n,v])=>`<div class="a-row"><span class="n">${n}</span><span class="fill"></span>
        <span class="p" style="color:${rare(v)}">₽${v.toLocaleString('en-US')}</span></div>`).join('')}
    </div>
    <div class="a-foot">CLICK ANYWHERE TO CLOSE</div>
  </div>`;
}
function tplB(died){
  const pad=(s,n)=>s+' '.repeat(Math.max(0,n-s.length));
  return `<div class="v v-b">
    <div class="b-glow"></div>
    <div class="b-crt">
      <div class="b-line" data-k="head">> LOOTNET TERMINAL v2.4 :: SESSION 0x4F2A</div>
      <div class="b-line" data-k="head"><span class="dim">> STATUS ....... </span>${died?'CONNECTION LOST / OPERATOR DOWN':'EXTRACTION CONFIRMED'}</div>
      <div class="b-line" data-k="head"><span class="dim">> MANIFEST BEGIN</span></div>
      ${ITEMS.map(([n,v])=>`<div class="b-line"><span>  ${pad(n,32)}</span><span class="fill"></span><span>  ₽${v.toLocaleString('en-US').padStart(11)}</span></div>`).join('')}
      <div class="b-line"><span class="dim">> MANIFEST END / ${STATS.items} UNITS / ${STATS.pmc+STATS.scav} CONTACTS NEUTRALIZED / +${STATS.xp.toLocaleString('en-US')} XP</span></div>
      <div class="b-total"><span>TOTAL  </span><span class="fill"></span><span id="num">₽ 0</span><span class="b-cursor"></span></div>
    </div>
  </div>`;
}
function tplC(died){
  return `<div class="v v-c">
    <div class="c-burst"></div>
    <div class="c-head">${died?'YOU DIED':'RAID COMPLETE'}</div>
    <div class="c-total" id="num">₽ 0</div>
    <div class="c-sub">TOTAL VALUE</div>
    <div class="c-combo">x1</div>
    <div class="c-chips">
      ${ITEMS.map(([n,v])=>`<div class="c-chip" style="border-left-color:${rare(v)}">${n}<small style="color:${rare(v)}">₽${v.toLocaleString('en-US')}</small></div>`).join('')}
    </div>
    <div class="c-stats">
      <div class="c-stat"><b style="color:#ffd700">0</b><span>ITEMS</span></div>
      <div class="c-stat"><b style="color:#ff4b4b">0</b><span>PMC</span></div>
      <div class="c-stat"><b style="color:#9a9a9a">0</b><span>SCAV</span></div>
      <div class="c-stat"><b style="color:#66d9ff">0</b><span>XP</span></div>
    </div>
  </div>`;
}
function tplD(died){
  return `<div class="v v-d">
    <div class="d-tint"></div>
    <div class="d-bar t"></div><div class="d-bar b"></div>
    <div class="d-line"></div>
    <div class="d-body">
      <div class="d-kick">${died?'OPERATOR DOWN':'EXTRACTION COMPLETE'}</div>
      <div class="d-title">${died?'You did not make it out.':'You made it out.'}</div>
      <div class="d-total" id="num">₽ 0</div>
    </div>
    <div class="d-side">
      ${ITEMS.slice(0,5).map(([n,v])=>`<div class="d-srow"><em>${n}</em><b>₽${v.toLocaleString('en-US')}</b></div>`).join('')}
      <div class="d-srow"><em>${STATS.items} items · ${STATS.pmc} PMC · ${STATS.scav} scav</em><b>+${STATS.xp.toLocaleString('en-US')} XP</b></div>
    </div>
    <div class="d-meta">CUSTOMS · 14:22 · CLICK TO CONTINUE</div>
  </div>`;
}
const TPL={a:tplA,b:tplB,c:tplC,d:tplD};

/* ── sequencers ── */
let token=0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function countTo(el, to, dur, s){
  const t0=performance.now();
  return new Promise(res=>{
    (function step(now){
      const p=Math.min(1,(now-t0)/dur);
      el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));
      p<1 ? requestAnimationFrame(step) : res();
    })(performance.now());
  });
}
function countPlain(el, to, dur){
  const t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(to*p).toLocaleString('en-US');
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}

async function play(v, died){
  const my=++token;
  const stage=document.getElementById('stage');
  stage.innerHTML=TPL[v](died);
  const root=stage.firstElementChild;
  root.classList.toggle('died',died);
  const s=SND[v], num=root.querySelector('#num');
  await sleep(30); root.classList.add('play');
  s.enter();
  const alive=()=>my===token;

  if(v==='a'){
    await sleep(1050); if(!alive())return; s.accent();
    await sleep(350);
    const rows=[...root.querySelectorAll('.a-row')];
    let run=0;
    for(let i=0;i<rows.length;i++){
      if(!alive())return;
      rows[i].classList.add('on'); s.tick(i);
      run+=ITEMS[i][1]; num.textContent=fmt(run);
      await sleep(170);
    }
    num.classList.add('big'); s.finale();
    const st=[...root.querySelectorAll('.a-stat')], vals=[STATS.items,STATS.pmc,STATS.scav,STATS.xp];
    for(let i=0;i<st.length;i++){
      if(!alive())return;
      st[i].classList.add('on'); s.stat(); countPlain(st[i].querySelector('b'),vals[i],600);
      await sleep(130);
    }
  }

  if(v==='b'){
    const lines=[...root.querySelectorAll('.b-line')];
    for(let i=0;i<lines.length;i++){
      if(!alive())return;
      lines[i].classList.add('on');
      lines[i].dataset.k==='head' ? s.accent() : s.tick(i);
      await sleep(lines[i].dataset.k==='head'?190:130);
    }
    await sleep(260); if(!alive())return;
    root.querySelector('.b-total').classList.add('on'); s.finale();
    await countTo(num,TOTAL,900);
  }

  if(v==='c'){
    await sleep(320);
    const chips=[...root.querySelectorAll('.c-chip')];
    const combo=root.querySelector('.c-combo'), burst=root.querySelector('.c-burst');
    let run=0;
    for(let i=0;i<chips.length;i++){
      if(!alive())return;
      chips[i].classList.add('on'); s.tick(i);
      run+=ITEMS[i][1]; num.textContent=fmt(run);
      num.classList.remove('kick'); void num.offsetWidth; num.classList.add('kick');
      if(ITEMS[i][1]>=150000){
        burst.classList.add('on'); setTimeout(()=>burst.classList.remove('on'),110);
        combo.textContent='x'+(i+1); combo.classList.add('on');
        setTimeout(()=>combo.classList.remove('on'),420);
        s.accent();
      }
      await sleep(230);
    }
    s.finale();
    const st=[...root.querySelectorAll('.c-stat')], vals=[STATS.items,STATS.pmc,STATS.scav,STATS.xp];
    for(let i=0;i<st.length;i++){
      if(!alive())return;
      st[i].classList.add('on'); s.stat(); countPlain(st[i].querySelector('b'),vals[i],700);
      await sleep(110);
    }
  }

  if(v==='d'){
    await sleep(1150); if(!alive())return;
    await countTo(num,TOTAL,1400);
    const rows=[...root.querySelectorAll('.d-srow')];
    for(const r of rows){ if(!alive())return; r.classList.add('on'); s.tick(); await sleep(200); }
    if(!alive())return; s.finale();
  }
}

/* ── chrome wiring ── */
let cur='a', died=false;
const notes=document.getElementById('notes');
const caption=document.getElementById('caption');
function render(){
  document.querySelectorAll('.chrome [data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===cur));
  notes.innerHTML=NOTES[cur];
  caption.innerHTML='Four full redesigns of the raid summary. Same data, different layout language and sound character. Sounds here are <b>synthesized stand-ins</b> for the EFT UI events listed below.';
  play(cur,died);
}
document.querySelectorAll('.chrome [data-v]').forEach(b=>b.onclick=()=>{cur=b.dataset.v;render();});
const oBtn=document.getElementById('outcome');
oBtn.onclick=()=>{died=!died; oBtn.textContent=died?'DIED':'SURVIVED'; oBtn.classList.toggle('died',died); oBtn.classList.toggle('active',died); play(cur,died);};
document.getElementById('replay').onclick=()=>play(cur,died);
const mBtn=document.getElementById('mute');
mBtn.onclick=()=>{muted=!muted; mBtn.textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON';};
render();
</script>
